[package]
name = "galileo-cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "galileo"
path = "src/main.rs"

[dependencies]
galileo-bindgen = { path = "../galileo-bindgen" }
galileo-core = { path = "../galileo-core" }
galileo-nix = { path = "../galileo-nix" }
galileo-syntax = { path = "../galileo-syntax" }
galileo-lsp = { path = "../galileo-lsp" }
galileo-import = { path = "../galileo-import" }
galileo-runtime = { path = "../galileo-runtime" }
galileo-review = { path = "../galileo-review" }

[[test]]
name = "generated_enables"
path = "../../tests/external/firn-tags/generated.rs"

[[test]]
name = "flake_inputs"
path = "../../tests/external/firn-tags/inputs.rs"

[[test]]
name = "firn_review"
path = "../../tests/external/firn-tags/review.rs"
